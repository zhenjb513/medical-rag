server:
  # ====== 服务端口 ======
  port: 8080

spring:
  # ====== 默认激活 local profile，加载本地 application-local.yml（已加入 .gitignore）======
  profiles:
    active: local

  # ====== 日志级别：屏蔽第三方库无实质影响的警告 / 冗余 INFO ======
  logging:
    level:
      # PDFBox 对"生成不规范但解析成功"的 PDF 会大量打印 WARN（如 invalid object number / malformed substream），
      # 这些都是 PDFBox 已经用 lenient 模式自动修复、不影响结果的警告。真正致命错误会走 ERROR 级别。
      org.apache.pdfbox: ERROR
      # Spring AI TextSplitter 的 "Splitting up document into X chunks" INFO 有点冗余，
      # RagInitializer 自己会打印「chunks=N  totalChars=xxxxx」这样更详细的诊断
      org.springframework.ai.transformer.splitter: WARN

  # ====== 主数据源：本地 MySQL（业务数据：耗材库存 consumables 表） ======
  datasource:
    url: jdbc:mysql://localhost:3306/demoAI?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ====== 阿里云百炼 DashScope AI 配置 ======
  ai:
    dashscope:
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      # 百炼平台的 Embedding 模型（用于把文字变向量）
      # ⚠️ 注意维度必须和 app.pgvector.dimensions 严格一致：
      #     text-embedding-v3  默认 1024 维（可选 512/1024/2048，**不支持 1536**！）
      #     text-embedding-v2  默认 1536 维
      embedding:
        options:
          model: text-embedding-v3

# ====== 应用级配置（RAG 知识库 + PgVector 向量存储）======
app:
  # ====== RAG 知识库 PDF 扫描路径（不再写死文件名！3 种用法任选）======
  #   ① 【推荐】目录模式：自动扫描该目录下所有 *.pdf（新增 PDF 直接丢进去，重启应用即可入库）
  #        pdf-path: D:/ai-docs
  #   ② 单个文件模式：只处理指定 PDF（临时测单个文件用）
  #        pdf-path: D:/ai-docs/耗材入库操作手册.pdf
  #   ③ 不填 → 默认兜底目录 D:/ai-docs（目录不存在 / 无 PDF 时优雅跳过，不报错）
  pdf-path: D:/ai-docs

  # ====== OCR 配置（纯图片扫描 PDF 兜底识别）======
  #   当 P1/P2/P3 三层都提取不到文字时（纯图片扫描件），自动调用 Tesseract OCR 识别
  #   下载安装：https://github.com/UB-Mannheim/tesseract/wiki （安装时勾选 "Chinese - Simplified" 语言包）
  ocr:
    # 是否启用 OCR 兜底（true=启用，false=纯图片PDF直接跳过）
    enabled: true
    # tesseract.exe 绝对路径（安装路径请根据实际情况修改）
    tesseract-path: D:/Program Files/Tesseract-OCR/tesseract.exe
    # 训练数据目录（tessdata 文件夹绝对路径，里面要有 chi_sim.traineddata）
    #   ✅ Program Files 权限不够时，推荐放到 D:/tessdata/（无需管理员权限）
    tessdata-dir: D:/tessdata
    # OCR 识别语言（chi_sim=简体中文，中英文混合推荐：chi_sim+eng）
    language: chi_sim+eng
    # 渲染 DPI（越高越准确但越慢，推荐 250~350）
    dpi: 300
    # 每页 OCR 超时秒数（防止某页卡死整份 PDF）
    page-timeout-seconds: 120

  retrieval:
    # 检索模式：vector=纯向量（改造前的行为）；hybrid=向量+BM25 做 RRF 融合
    # hybrid 是否再叠一层重排由下面的 rerank-enabled 决定（评测接口另有 mode=rerank 可强制开启对比）
    # bm25 在这里配了会自动降级成 hybrid 并打启动警告：纯关键词命中没有余弦，可答性闸门判不了，
    # 生产问答不允许只走关键词；要看 bm25 单边用零调用的 /evaluation/recall?mode=bm25
    # 58 题 ground-truth 实测后切到 hybrid+重排：答案块@1 从 39.7% 提到 58.6%，MRR 0.543→0.691
    mode: hybrid
    # 每一路先取多少条参与融合。29 题 ground-truth 实测：probe-size=8 比 20 在 top8 口径上
    # 答案块全覆盖 72.4% vs 62.1%，且 top1 没变差，所以默认收窄到 8
    probe-size: 8
    # RRF 平滑系数：越大越看「两路都在」，越小越看「单路第一名」。实测 10 和 60 结果几乎一样
    rrf-k: 60
    # 两路的话语权。58 题实测：口语化提问下 BM25 答案块命中@1 只有 10.3%（向量 31.0%），
    # 等权会把向量排好的中段挤掉（前4名 65.5%→48.3%），所以关键词降权、只在书面术语题里当补充
    vector-weight: 1.0
    bm25-weight: 0.4
    # hybrid 模式下向量侧的相似度下限。实测：正常问题第 20 名还有 0.60~0.72，
    # 真正无关的问题只有 0.39~0.44，所以下限取 0.45 足够，不要用 0.65 那种"看着像阈值"的值
    vector-floor: 0.45
    # 可答性闸门：向量通道「最像的那一条」低于此值就整批不给知识库上下文，让模型回答"无法回答"。
    # 58 题实测：正常提问 top1 余弦 0.614~0.881，库里确实没答案的（肺癌手术/脑瘤/Java/电影票房）只有 0.388~0.568。
    # 0.60 这条线两边分得开，但离最低的正当题（运动心率 0.614）只差 0.014，真要误伤就往下调并补进测试集。
    # 已知放行不掉的：「火星上有没有心血管指南」top1=0.660，任何检索分数都拦不住它。
    answer-floor: 0.60
    # 命中块的前后邻居是否一起进上下文（指南里的数值表格常被切开）
    expand-neighbors: true
    # 扩展后一次最多给模型多少块，防止上下文撑爆
    max-context-chunks: 16
    # ====== 重排（gte-rerank-v2，把提问和候选块成对送进模型重新打分）======
    # 58 题实测（同一批候选，只差排序）：答案块@1 39.7%→58.6%、@2 55.2%→72.4%、@4 67.2%→77.6%，
    # @8/@20 完全没变——重排不召回新东西，只把已经在池子里的正确答案往前搬，而进提示词的正是前几名。
    # 口语化提问也一起涨（@1 27.6%→44.8%），因为交叉编码器看的是「这段有没有回答」而不是「词有没有对上」。
    # 代价：每题多一次外网调用（实测 150ms→344ms/题）；调用失败会自动退回融合顺序，不会把问答搞挂。
    rerank-enabled: true
    rerank-model: gte-rerank-v2
    # 重排前先从融合池里取多少块。重排只能在池子里换座位，池子多大它就最多能救多远的块
    rerank-window: 20
    # 重排那一步送给模型的查询串：false=只用患者原话（默认）；true=连补进去的指南术语一起送。
    # 召回通道（向量/BM25）永远用扩展串，这个开关只管重排。
    # 开 true 的动机：口语题「我血糖偏高」用原话重排时，考卷标注的四个答案块（《中国血脂管理指南2023年》#90/#91/#92 +
    # 《中国心血管病一级预防指南2020》#72）一个都进不了 16 块上下文，模型只能引到 #76 的 1.4（scratch/g12_run.json）。
    # 实测效果（scratch/ctx42_off.out vs ctx42_on.out、g14_f41_on.out、g14_f43_on.out）：#89 从第 8 名升到第 4 名，
    # 它的相邻块 #90（逐字含「中、低危糖尿病患者 LDL-C 应控制在 2.6 mmol/L 以下」）因此拿到邻居名额进上下文，
    # 三道含触发词的口语题端到端全过（scratch/g15_run.json、g17_run.json）；被挤出去的都是非答案块，无回退。
    # 影响面只有含触发词的那 5 道题：坏胆固醇/血糖/全家/遗传 3 道口语题（#41/#42/#43）+
    # WHO/世界卫生组织 2 道（#24 事实题、#53 口语题）。英文桥的实测差别（scratch/g18_diff.out、g19_f53_on.out）：
    # BM25 通道两题都从「答案块 0% 覆盖」到 100%；端到端只有 #53 是回退题（旧跑里 WHO 块压根不在 16 块上下文，
    # 模型引的是基层指南#18，scratch/f12_run.json），#24 本来就靠向量通道过（WHO#29 当时已在第 2 块）。
    # 其余 56 题查询串一个字都不变（防呆断言见 scratch/QueryExpandCheck.java，29 条全过）。
    rerank-use-expanded-query: true
    # ⚠️ 重排分不能当「知识库能不能答」的门槛：实测答对的题 top1 也能只有 0.198，
    #    而「火星上有没有心血管病指南」这种明显域外的问题 top1 有 0.194，两者分不开。
    #    判定能不能答只用上面那个 answer-floor（看向量通道第一名），重排分只负责排序。

  pgvector:
    # ✨ 关键开关 ✨
    #   false → SimpleVectorStore（内存向量库，默认，开箱即用，重启会清空向量）
    #   true  → PgVectorStore（PostgreSQL vector 列持久化，需要 PG 17 + pgvector dll 已装）
    enabled: true

    # --- 以下仅当 enabled=true 才生效 ---
    jdbc-url: jdbc:postgresql://localhost:5432/postgres?charSet=UTF8&stringtype=unspecified&prepareThreshold=0
      # 参数说明：
      #   charSet=UTF8             → PostgreSQL JDBC 驱动强制 UTF-8（和 MySQL 的 characterEncoding 参数名不同！）
      #   stringtype=unspecified   → 传 String 给 setString 不声明 varchar 类型，让 PG 按目标列类型隐式转换，避免一次多余的编码转换
    #   prepareThreshold=0       → 关闭服务器端预编译语句缓存，避免一些旧版 PG JDBC 驱动和 pgvector 扩展的缓存串话问题
    driver-class-name: org.postgresql.Driver
    schema-name: public
    table-name: vector_store
    dimensions: 1024       # ⚠️ 必须严格匹配模型输出维度：text-embedding-v3 默认=1024，v2 才是 1536
    id-type: UUID
    index-type: HNSW
    distance-type: COSINE_DISTANCE
    initialize-schema: false    # 手动由 PgVectorSchemaInitializer 在 try-catch 里执行
    schema-validation: false
    # 重建 vector_store 表开关：true=启动时先清空并重建表（重新入库所有 PDF），false=保留现有数据增量入库
    reset-table: false