# 混合模式：pgvector + mysql 走 Windows 本地（保留真向量），redis + rabbitmq Docker 起
#
#   docker compose up -d
#
#   Windows 本地需要先启动：PostgreSQL(含 pgvector) + MySQL
services:
  redis:
    image: redis:7-alpine
    container_name: mkbai-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mkbai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/mkbAI?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      APP_PGVECTOR_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/postgres?charSet=UTF8&stringtype=unspecified&prepareThreshold=0
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      DEMO_PDF_PATH: /app/data/pdfs
    volumes:
      - ./data/pdfs:/app/data/pdfs:ro
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy