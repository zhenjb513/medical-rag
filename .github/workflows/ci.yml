name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
          - os: macos-latest
            shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Run tests
        shell: ${{ matrix.shell }}
        run: |
          ./mvnw test -B --no-transfer-progress
        env:
          MAVEN_OPTS: "-Xmx1024m"

      - name: Build jar
        shell: ${{ matrix.shell }}
        run: |
          ./mvnw package -DskipTests -B --no-transfer-progress
        env:
          MAVEN_OPTS: "-Xmx1024m"

      - name: Upload jar artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mkbAI-${{ runner.os }}
          path: target/*.jar
          if-no-files-found: error